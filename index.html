body::before{content:"";position:fixed;inset:0;background:var(--logo) center/min(92vmin,760px) no-repeat;opacity:.16;pointer-events:none;z-index:-1}
main{position:relative}
.foot{margin-top:28px;display:flex;justify-content:center}
.logo{width:120px;height:120px;border-radius:26px;background:var(--logo) center/cover no-repeat;box-shadow:0 3px 12px rgba(0,0,0,.18)}

h1{font-size:22px;margin:6px 0 2px;color:#111}
.sub{margin:0 0 18px;color:#3d3500;font-size:14px}
.card{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select,button{font:inherit;color:inherit;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;background:var(--card);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ltr{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
button.go{background:#111;color:#fcd704;border-color:#111;cursor:pointer;font-weight:700}
button.go:disabled{opacity:.6;cursor:wait}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}
th{width:150px;color:var(--mu);font-weight:400;white-space:nowrap}
tr:last-child th,tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-weight:700;background:var(--chip)}
.ok{color:var(--ok)}.fail{color:var(--bad)}.pending{color:var(--warn)}
.msg{padding:12px 14px;border-radius:8px;border:1px solid var(--bd);margin-bottom:12px}
.msg.warn{border-color:var(--warn);color:var(--warn)}.msg.err{border-color:var(--bad);color:var(--bad)}
.bar{display:flex;gap:8px;margin-top:12px}.bar button{width:auto;cursor:pointer}
h2{font-size:15px;margin:0 0 8px}
a{color:var(--ac)}
@media(max-width:560px){.form{grid-template-columns:1fr}th{width:100px}}

<div class="card">

    <div class="full"><label for="hash">هش تراکنش</label><input id="hash" class="ltr" placeholder="هش تراکنش را اینجا بچسبانید" autocomplete="off" spellcheck="false"></div>
    <div><label for="coin">ارز اعلام‌شده توسط کاربر</label><select id="coin"><option value="">انتخاب کنید…</option><option value="BTC">بیت‌کوین (BTC)</option><option value="ETH">اتریوم (ETH)</option><option value="BCH">بیت‌کوین کش (BCH)</option><option value="LTC">لایت‌کوین (LTC)</option><option value="USDT">تتر (USDT)</option><option value="ADA">کاردانو (ADA)</option><option value="AVAX">آوالانچ (AVAX)</option><option value="XRP">ریپل (XRP)</option><option value="TRX">ترون (TRX)</option><option value="SOL">سولانا (SOL)</option><option value="BNB">بایننس کوین (BNB)</option><option value="DOGE">دوج‌کوین (DOGE)</option></select></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EVM={
 ETH:{name:'ERC20 (Ethereum)',rpc:'https://ethereum-rpc.publicnode.com',nat:'ETH',ex:'https://etherscan.io/tx/'},
 BSC:{name:'BEP20 (BNB Smart Chain)',rpc:'https://bsc-rpc.publicnode.com',nat:'BNB',ex:'https://bscscan.com/tx/'},
 AVAX:{name:'Avalanche C-Chain',rpc:'https://avalanche-c-chain-rpc.publicnode.com',nat:'AVAX',ex:'https://snowtrace.io/tx/'}
};
const UTX={
 BTC:{name:'Bitcoin',u:'https://mempool.space/api',ex:'https://mempool.space/tx/',c:'BTC'},
 LTC:{name:'Litecoin',u:'https://litecoinspace.org/api',ex:'https://litecoinspace.org/tx/',c:'LTC'}
};
const BC={
 BCH:{n:'Bitcoin Cash',slug:'bitcoin-cash',ex:'https://blockchair.com/bitcoin-cash/transaction/',c:'BCH'},
 DOGE:{n:'Dogecoin',slug:'dogecoin',ex:'https://blockchair.com/dogecoin/transaction/',c:'DOGE'}
};
const COINS={
 BTC:{n:'بیت‌کوین',nets:['BTC']},
 ETH:{n:'اتریوم',nets:['ETH']},
 BCH:{n:'بیت‌کوین کش',nets:['BCH']},
 LTC:{n:'لایت‌کوین',nets:['LTC']},
 USDT:{n:'تتر',nets:['TRON','BSC']},
 ADA:{n:'کاردانو',nets:['ADA']},
 AVAX:{n:'آوالانچ',nets:['AVAX']},
 XRP:{n:'ریپل',nets:['XRP']},
 TRX:{n:'ترون',nets:['TRON']},
 SOL:{n:'سولانا',nets:['SOL']},
 BNB:{n:'بایننس کوین',nets:['BSC']},
 DOGE:{n:'دوج‌کوین',nets:['DOGE']}
};
const NETL={BTC:'Bitcoin',ETH:'ERC20 (Ethereum)',BCH:'Bitcoin Cash',LTC:'Litecoin',TRON:'TRC20 (TRON)',BSC:'BEP20 (BNB Smart Chain)',ADA:'Cardano',AVAX:'Avalanche C-Chain',XRP:'XRP Ledger',SOL:'Solana',DOGE:'Dogecoin'};
const TG='https://api.trongrid.io';
const TRC={TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t:['USDT',6],TEkxiTehnzSmSe2XqrBj4w32RUN966rdz8:['USDC',6]};
const TOPIC='ddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';

function fmt(v,d){const s=v.toString().padStart(d+1,'0');const i=s.slice(0,s.length-d),f=s.slice(s.length-d).replace(/0+$/,'');return i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(f?'.'+f:'')}

/* ---------- EVM ---------- */
async function rpc(url,method,params){
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result}
const tcache={};
function hex2s(h){let s='';for(let i=0;i<h.length;i+=2){const n=parseInt(h.slice(i,i+2),16);if(n)s+=String.fromCharCode(n)}return s}
async function tokenInfo(u,a){
 const k=u+a;if(tcache[k])return tcache[k];let sym='?',dec=18;
 try{const d=parseInt(await rpc(u,'eth_call',[{to:a,data:'0x313ce567'},'latest']),16);if(!isNaN(d))dec=d}catch{}
 try{const h=(await rpc(u,'eth_call',[{to:a,data:'0x95d89b41'},'latest'])).slice(2);
  sym=h.length===64?hex2s(h):hex2s(h.slice(128,128+parseInt(h.slice(64,128),16)*2))||'?'}catch{}
 return tcache[k]=[sym,dec]}
async function evm(h,k){
 const c=EVM[k];
 const [tx,rc,bn]=await Promise.all([rpc(c.rpc,'eth_getTransactionByHash',[h]),rpc(c.rpc,'eth_getTransactionReceipt',[h]),rpc(c.rpc,'eth_blockNumber',[])]);
 if(!tx)return null;
 const o={net:c.name,link:c.ex+h,hash:h,from:tx.from,to:tx.to,transfers:[],status:'pending'};
 if(rc){
  o.status=rc.status==='0x1'?'ok':'fail';
  o.block=parseInt(rc.blockNumber,16);o.conf=parseInt(bn,16)-o.block+1;
  const b=await rpc(c.rpc,'eth_getBlockByNumber',[rc.blockNumber,false]);
  o.time=parseInt(b.timestamp,16)*1000;
  o.fee=fmt(BigInt(rc.gasUsed)*BigInt(rc.effectiveGasPrice||tx.gasPrice),18)+' '+c.nat;
  for(const l of rc.logs){
   if(l.topics[0]!=='0x'+TOPIC||l.topics.length!==3)continue;
   const [sym,dec]=await tokenInfo(c.rpc,l.address);
   o.transfers.push({sym,amount:fmt(BigInt(l.data),dec),from:'0x'+l.topics[1].slice(26),to:'0x'+l.topics[2].slice(26),contract:l.address});
  }
 }
 if(BigInt(tx.value)>0n)o.transfers.unshift({sym:c.nat,amount:fmt(BigInt(tx.value),18),from:tx.from,to:tx.to});
 return o}

/* ---------- TRON ---------- */
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
async function sha(b){return new Uint8Array(await crypto.subtle.digest('SHA-256',b))}
async function t58(hex){
 const b=Uint8Array.from(hex.match(/../g).map(x=>parseInt(x,16)));
 const cs=(await sha(await sha(b))).slice(0,4),a=[...b,...cs];
 let n=BigInt('0x'+a.map(x=>x.toString(16).padStart(2,'0')).join('')),s='';
 while(n>0n){s=B58[Number(n%58n)]+s;n/=58n}
 for(const x of a){if(x===0)s='1'+s;else break}return s}
async function post(p,b){const r=await fetch(TG+p,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(b)});return r.json()}
async function tron(h){
 const [tx,inf,nb]=await Promise.all([post('/wallet/gettransactionbyid',{value:h}),post('/wallet/gettransactioninfobyid',{value:h}),post('/wallet/getnowblock',{})]);
 if(!tx||!tx.txID)return null;
 const o={net:'TRC20 (TRON)',link:'https://tronscan.org/#/transaction/'+h,hash:h,transfers:[],status:'pending'};
 const ct=tx.raw_data.contract[0],pv=ct.parameter.value;
 o.from=await t58(pv.owner_address);
 const ret=tx.ret&&tx.ret[0]&&tx.ret[0].contractRet;
 if(inf&&inf.blockNumber){
  o.block=inf.blockNumber;o.time=inf.blockTimeStamp;
  o.conf=nb.block_header.raw_data.number-o.block+1;
  o.status=ret==='SUCCESS'?'ok':'fail';if(ret&&ret!=='SUCCESS')o.reason=ret;
  o.fee=((inf.fee||0)/1e6)+' TRX';
 }
 if(ct.type==='TransferContract'){
  o.to=await t58(pv.to_address);
  o.transfers.push({sym:'TRX',amount:fmt(BigInt(pv.amount),6),from:o.from,to:o.to});
 }else if(inf&&inf.log){
  for(const l of inf.log){
   if(!l.topics||l.topics[0]!==TOPIC||l.topics.length!==3)continue;
   const ca=await t58('41'+l.address);let [sym,dec]=TRC[ca]||[null,null];
   if(dec===null){dec=6;sym=ca.slice(0,6)+'…';}
   const from=await t58('41'+l.topics[1].slice(24)),to=await t58('41'+l.topics[2].slice(24));
   o.transfers.push({sym,amount:fmt(BigInt('0x'+l.data),dec),from,to,contract:ca,guess:!TRC[ca]});
   o.to=o.to||to;
  }
 }
 return o}

/* ---------- Bitcoin / Litecoin ---------- */
async function utxo(h,k){
 const c=UTX[k];const r=await fetch(c.u+'/tx/'+h);
 if(r.status===404||r.status===400)return null;if(!r.ok)throw new Error('HTTP '+r.status);
 const t=await r.json();const tip=await (await fetch(c.u+'/blocks/tip/height')).json();
 const ins=[...new Set(t.vin.map(v=>v.prevout&&v.prevout.scriptpubkey_address).filter(Boolean))];
 const o={net:c.name,link:c.ex+h,hash:h,transfers:[],from:ins.join('\n'),status:t.status.confirmed?'ok':'pending',fee:fmt(BigInt(t.fee),8)+' '+c.c};
 if(t.status.confirmed){o.block=t.status.block_height;o.time=t.status.block_time*1000;o.conf=tip-o.block+1}
 for(const v of t.vout)o.transfers.push({sym:c.c,amount:fmt(BigInt(v.value),8),from:o.from,to:v.scriptpubkey_address||'(OP_RETURN)'});
 return o}

/* ---------- Bitcoin Cash / Dogecoin (Blockchair) ---------- */
async function blockchair(h,k){
 const c=BC[k];const r=await fetch('https://api.blockchair.com/'+c.slug+'/dashboards/transaction/'+h);
 if(r.status===404)return null;
 if(!r.ok)throw new Error('Blockchair HTTP '+r.status);
 const j=await r.json();const d=Object.values(j.data||{})[0];
 if(!d||!d.transaction)return null;
 const t=d.transaction,tip=j.context&&j.context.state;
 const ins=[...new Set(d.inputs.map(i=>i.recipient).filter(Boolean))];
 const done=t.block_id>0;
 const o={net:c.n,link:c.ex+h,hash:h,from:ins.join('\n'),transfers:[],status:done?'ok':'pending',fee:fmt(BigInt(t.fee),8)+' '+c.c};
 if(done){o.block=t.block_id;o.time=Date.parse(t.time.replace(' ','T')+'Z');o.conf=tip-t.block_id+1}
 for(const v of d.outputs)o.transfers.push({sym:c.c,amount:fmt(BigInt(v.value),8),from:o.from,to:v.recipient||'(OP_RETURN)'});
 return o}

/* ---------- XRP ---------- */
async function xrp(h){
 const r=await fetch('https://xrplcluster.com/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'tx',params:[{transaction:h,binary:false}]})});
 const j=(await r.json()).result;
 if(j.error==='txnNotFound')return null;if(j.error)throw new Error(j.error);
 const code=j.meta&&j.meta.TransactionResult;
 const o={net:'XRP Ledger',link:'https://xrpscan.com/tx/'+h,hash:h,from:j.Account,to:j.Destination,transfers:[],
  status:!j.validated?'pending':code==='tesSUCCESS'?'ok':'fail',fee:fmt(BigInt(j.Fee),6)+' XRP'};
 if(code&&code!=='tesSUCCESS')o.reason=code;
 if(j.DestinationTag!=null)o.tag=String(j.DestinationTag);
 if(j.validated){o.block=j.ledger_index;o.time=(j.date+946684800)*1000}
 const a=(j.meta&&j.meta.delivered_amount)||j.Amount;
 if(j.TransactionType==='Payment'&&a){
  if(typeof a==='string'){if(/^\d+$/.test(a))o.transfers.push({sym:'XRP',amount:fmt(BigInt(a),6),from:j.Account,to:j.Destination})}
  else o.transfers.push({sym:a.currency,amount:a.value,from:j.Account,to:j.Destination})
 }
 return o}

/* ---------- Solana ---------- */
async function sol(h){
 const t=await rpc('https://solana-rpc.publicnode.com','getTransaction',[h,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]);
 if(!t)return null;
 const keys=t.transaction.message.accountKeys.map(k=>k.pubkey||k),m=t.meta;
 const o={net:'Solana',link:'https://solscan.io/tx/'+h,hash:h,from:keys[0],transfers:[],status:m.err?'fail':'ok',block:t.slot,time:t.blockTime?t.blockTime*1000:null,fee:fmt(BigInt(m.fee),9)+' SOL'};
 if(m.err)o.reason=JSON.stringify(m.err);
 keys.forEach((a,i)=>{const d=m.postBalances[i]-m.preBalances[i];if(i!==0&&d>0)o.transfers.push({sym:'SOL',amount:fmt(BigInt(d),9),from:keys[0],to:a})});
 o.to=o.transfers[0]&&o.transfers[0].to;
 return o}

/* ---------- Cardano (Koios) ---------- */
const KO='https://api.koios.rest/api/v1';
async function ada(h){
 const r=await fetch(KO+'/tx_info',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_tx_hashes:[h.toLowerCase()]})});
 if(!r.ok)throw new Error('Koios HTTP '+r.status);
 const t=(await r.json())[0];if(!t)return null;
 const tip=(await (await fetch(KO+'/tip')).json())[0];
 const ad=x=>x.payment_addr&&x.payment_addr.bech32;
 const ins=[...new Set(t.inputs.map(ad).filter(Boolean))];
 const o={net:'Cardano',link:'https://cardanoscan.io/transaction/'+h,hash:h,from:ins.join('\n'),transfers:[],status:'ok',block:t.block_height,time:t.tx_timestamp*1000,conf:tip.block_no-t.block_height+1,fee:fmt(BigInt(t.fee),6)+' ADA'};
 for(const v of t.outputs)o.transfers.push({sym:'ADA',amount:fmt(BigInt(v.value),6),from:o.from,to:ad(v)||'—'});
 return o}

/* ---------- main ---------- */
const jobs={ETH:h=>evm(h,'ETH'),BSC:h=>evm(h,'BSC'),AVAX:h=>evm(h,'AVAX'),TRON:tron,BTC:h=>utxo(h,'BTC'),LTC:h=>utxo(h,'LTC'),BCH:h=>blockchair(h,'BCH'),DOGE:h=>blockchair(h,'DOGE'),XRP:xrp,SOL:sol,ADA:ada};
const isEvm=k=>k in EVM;
function ago(ms){const s=Math.max(0,(Date.now()-ms)/1000);
 if(s<60)return 'چند ثانیه پیش';
 if(s<3600)return Math.floor(s/60)+' دقیقه پیش';
 if(s<86400)return Math.floor(s/3600)+' ساعت پیش';
 return Math.floor(s/86400)+' روز پیش'}
const ST={ok:['موفق (Success)','ok'],fail:['ناموفق (Failed)','fail'],pending:['در انتظار تأیید (Pending)','pending']};

async function search(){
 const out=$('#out'),coin=$('#coin').value,net=$('#net').value;let h=$('#hash').value.trim();
 const err=t=>{out.innerHTML='<div class="msg err">'+t+'</div>'};
 if(!coin){err('ابتدا ارز را انتخاب کنید.');return}
 if(!h){err('هش را وارد کنید.');return}
 const keys=net==='auto'?COINS[coin].nets:[net];
 if(keys.every(isEvm)&&/^[0-9a-f]{64}$/i.test(h))h='0x'+h;
 const okFmt=k=>isEvm(k)?/^0x[0-9a-f]{64}$/i.test(h):k==='SOL'?/^[1-9A-HJ-NP-Za-km-z]{80,90}$/.test(h):/^[0-9a-f]{64}$/i.test(h);
 const use=keys.filter(okFmt);
 if(!use.length){
  const need=[...new Set(keys.map(k=>isEvm(k)?'0x و ۶۴ کاراکتر هگزادسیمال':k==='SOL'?'امضای Base58 (حدود ۸۸ کاراکتر)':'۶۴ کاراکتر هگزادسیمال بدون 0x'))].join(' یا ');
  err('فرمت هش با شبکه '+esc(keys.map(k=>NETL[k]).join(' / '))+' نمی‌خواند. فرمت درست: '+need+'.'+(/^0x/i.test(h)?' این هش با 0x شروع می‌شود و مربوط به شبکه‌های EVM (ERC20، BEP20، Avalanche) است.':''));
  return}
 const btn=$('#go');btn.disabled=true;btn.textContent='در حال جستجو…';out.innerHTML='';
 try{
  const res=await Promise.allSettled(use.map(k=>jobs[k](h)));
  const hit=res.find(r=>r.status==='fulfilled'&&r.value);
  if(hit)return show(hit.value,coin,net);
  const errs=res.filter(r=>r.status==='rejected').map(r=>r.reason.message||String(r.reason));
  err('تراکنشی با این هش در شبکه '+esc(use.map(k=>NETL[k]).join(' / '))+' پیدا نشد. شبکه را بررسی کنید یا مطمئن شوید تراکنش هنوز در شبکه ثبت شده است.'+(errs.length?'<br><span class="ltr">'+esc(errs.join(' | '))+'</span>':''));
 }finally{btn.disabled=false;btn.textContent='جستجو'}
}

function show(o,coin,net){
 const [stL,stC]=ST[o.status];let html='';
 const syms=[...new Set(o.transfers.map(t=>t.sym))];
 if(coin&&o.transfers.length&&!syms.some(s=>s.toUpperCase()===coin))
  html+='<div class="msg warn">ارز اعلام‌شده ('+esc(coin)+') با ارز واقعی این تراکنش ('+esc(syms.join('، '))+') نمی‌خواند.</div>';
 if(o.transfers.some(t=>t.guess))html+='<div class="msg warn">قرارداد این توکن در لیست شناخته‌شده‌ها نیست؛ نام و تعداد رقم اعشار آن تخمینی است. آدرس قرارداد را در اکسپلورر بررسی کنید.</div>';
 const rows=[
  ['وضعیت','<span class="tag '+stC+'">'+stL+'</span>'+(o.reason?' <span class="ltr">'+esc(o.reason)+'</span>':'')],
  ['شبکه',esc(o.net)],
  ['ارز / مقدار',o.transfers.length?o.transfers.map(t=>'<b>'+esc(t.amount)+'</b> '+esc(t.sym)).join('<br>'):'—'],
  ['فرستنده','<bdi class="ltr">'+esc(o.from||'—').replace(/\n/g,'<br>')+'</bdi>'],
  ['گیرنده',o.transfers.length?[...new Set(o.transfers.map(t=>t.to))].map(a=>'<bdi class="ltr">'+esc(a)+'</bdi>').join('<br>'):'<bdi class="ltr">'+esc(o.to||'—')+'</bdi>'],
  ...(o.tag?[['Destination Tag / Memo','<span class="ltr">'+esc(o.tag)+'</span>']]:[]),
  ['زمان',o.time?esc(new Date(o.time).toLocaleString('fa-IR'))+' — <span class="ltr">'+new Date(o.time).toISOString().replace('T',' ').slice(0,19)+' UTC</span><br>'+ago(o.time):'هنوز در بلاک قرار نگرفته'],
  ['تعداد تأیید',o.conf!=null?String(o.conf):'—'],
  ['شماره بلاک',o.block!=null?'<span class="ltr">'+o.block+'</span>':'—'],
  ['کارمزد',o.fee?'<span class="ltr">'+esc(o.fee)+'</span>':'—'],
  ['هش','<bdi class="ltr">'+esc(o.hash)+'</bdi>'],
  ['اکسپلورر','<a href="'+esc(o.link)+'" target="_blank" rel="noopener" class="ltr">'+esc(o.link)+'</a>']
 ];
 html+='<div class="card wrap"><table>'+rows.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join('')+'</table>'
  +'<div class="bar"><button id="cp">کپی خلاصه</button></div></div>';
 $('#out').innerHTML=html;
 $('#cp').onclick=async e=>{
  const t=o.transfers.map(x=>x.amount+' '+x.sym).join(' + ')||'—';
  const txt=['وضعیت: '+stL,'شبکه: '+o.net,'مقدار: '+t,'فرستنده: '+(o.from||'—'),'گیرنده: '+[...new Set(o.transfers.map(x=>x.to))].join(' , '),'زمان: '+(o.time?new Date(o.time).toLocaleString('fa-IR')+' ('+ago(o.time)+')':'—'),'تأییدها: '+(o.conf??'—'),'هش: '+o.hash,'لینک: '+o.link].join('\n');
  try{await navigator.clipboard.writeText(txt);e.target.textContent='کپی شد'}catch{e.target.textContent='کپی نشد'}
  setTimeout(()=>e.target.textContent='کپی خلاصه',1500)};
}
function fillNets(){
 const c=$('#coin').value,n=$('#net');
 if(!c){n.innerHTML='<option value="">ابتدا ارز را انتخاب کنید</option>';return}
 const ks=COINS[c].nets;
 n.innerHTML=(ks.length>1?'<option value="auto">تشخیص خودکار (بر اساس هش)</option>':'')+ks.map(k=>'<option value="'+k+'">'+NETL[k]+'</option>').join('');
}
$('#coin').onchange=fillNets;fillNets();
$('#go').onclick=search;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='BUTTON')search()});
</script>
